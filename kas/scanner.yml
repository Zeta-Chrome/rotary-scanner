header:
  version: 14

machine: raspberrypi3-64
distro: scanner 
target: scanner-image 

repos:
  this:
    layers:
      meta-scanner:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap 
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap 
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap 

local_conf_header:
  cache: |
    DL_DIR = "${TOPDIR}/../yocto-cache/downloads"
    SSTATE_DIR = "${TOPDIR}/../yocto-cache/sstate"
  rpi: |
    ENABLE_UART = "1"
    ENABLE_SPI_BUS = "1"
    RPI_USE_U_BOOT = "1"
    CMDLINE_ROOT_PARTITION = "/dev/sda2"
    BOOT_MEDIA = "usb"
    RPI_EXTRA_CONFIG = "core_freq=250\n"
    IMAGE_FSTYPES = "wic.bz2 wic.bmap"
    WKS_FILE = "scanner-usb.wks"
  access: |
    EXTRA_IMAGE_FEATURES += "debug-tweaks ssh-server-openssh"
  license: |
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
