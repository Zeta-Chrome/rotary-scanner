BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-scanner"
BBFILE_PATTERN_meta-scanner = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-scanner = "6"

LAYERDEPENDS_meta-scanner = "core"
LAYERSERIES_COMPAT_meta-scanner = "scarthgap"
